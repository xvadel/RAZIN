readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "langgraph",
    "langchain-google-genai",
    "langchain-groq",
    "langchain-core",
    "ultralytics",
    "opencv-python-headless",
    "streamlit",
    "httpx",
    "python-multipart",
    "python-dotenv",
    "pillow",
    "chromadb",
    "transformers",
]
